name: CI

on: [push]

jobs:
  Build:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 22

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm build

      - name: Test narration generator (stubbed, no cloud access)
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary ':all:' pytest==8.3.4
          python3 -m pytest -q scripts/test_generate_article_audio.py

      # TODO Enable those lines below if you use a Redis cache, you'll also need to configure GitHub Repository Secrets
      # env:
      #   REDIS_HOST: ${{ secrets.REDIS_HOST }}
      #   REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      # - name: Build
      #   run: pnpm build
