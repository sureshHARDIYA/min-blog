name: Refresh public technology map

on:
  workflow_dispatch:
  push:
    branches:
      - feature/github-technology-map
    paths:
      - scripts/generate-github-activity.mjs
      - .github/workflows/refresh-github-activity.yml
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: github-technology-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate sanitized public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIVITY_USER: sureshHARDIYA
        run: node scripts/generate-github-activity.mjs

      - name: Commit updated snapshot
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- src/generated/github-activity.json; then
            echo "Technology map is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/github-activity.json
          git commit -m "chore: refresh public technology map"
          git push
