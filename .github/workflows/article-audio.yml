name: Generate article narration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'scripts/generate-article-audio.py'
permissions:
  contents: write
  id-token: write
concurrency:
  group: article-audio
  cancel-in-progress: false
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_AUDIO_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Generate and upload section audio
        env:
          ARTICLE_AUDIO_BUCKET: ${{ vars.ARTICLE_AUDIO_BUCKET }}
          ARTICLE_AUDIO_VOICE: en-US-Chirp3-HD-Leda
        run: python3 scripts/generate-article-audio.py
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/audio
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh article narration manifests"
            git push
          fi
