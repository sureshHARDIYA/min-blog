<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Authorization path</title><desc id="desc">Identity evidence flows from Entra ID to React while authorization is enforced by FastAPI and downstream services.</desc><rect width="1200" height="650" rx="28" fill="#F7F8FA"/><text x="72" y="76" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#111827">IDENTITY IS EVIDENCE. AUTHORIZATION IS A DECISION.</text>
  <g font-family="Inter,Arial"><rect x="72" y="154" width="224" height="126" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="184" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">MICROSOFT ENTRA ID</text><text x="184" y="232" text-anchor="middle" font-size="13" fill="#475569">OIDC · auth code + PKCE</text><text x="184" y="256" text-anchor="middle" font-size="13" fill="#475569">issues token evidence</text><rect x="354" y="154" width="224" height="126" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/><text x="466" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#6D28D9">REACT SPA</text><text x="466" y="232" text-anchor="middle" font-size="13" fill="#475569">renders permitted choices</text><text x="466" y="256" text-anchor="middle" font-size="13" fill="#475569">never grants authority</text><rect x="636" y="126" width="492" height="182" rx="18" fill="#FFF" stroke="#5EEAD4" stroke-width="2"/><text x="670" y="166" font-size="14" font-weight="700" fill="#0F766E">FASTAPI POLICY BOUNDARY</text><text x="670" y="200" font-size="14" fill="#334155">1. Validate issuer, audience, signature, lifetime</text><text x="670" y="229" font-size="14" fill="#334155">2. Require scope or application role</text><text x="670" y="258" font-size="14" fill="#334155">3. Enforce tenant + resource policy</text><text x="670" y="287" font-size="14" fill="#334155">4. Record decision + correlation ID</text>
  <path d="M296 217 H342 M578 217 H624" stroke="#64748B" stroke-width="3" fill="none"/><path d="M334 209 L344 217 L334 225 M616 209 L626 217 L616 225" fill="none" stroke="#64748B" stroke-width="3"/><text x="319" y="196" text-anchor="middle" font-size="11" fill="#64748B">SIGN IN</text><text x="607" y="196" text-anchor="middle" font-size="11" fill="#64748B">TOKEN</text>
  <rect x="210" y="390" width="330" height="142" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="375" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">RUST ASSESSMENT SERVICE</text><text x="375" y="465" text-anchor="middle" font-size="13" fill="#475569">validates delegated service context</text><text x="375" y="491" text-anchor="middle" font-size="13" fill="#475569">limits work · records outcome</text><rect x="660" y="390" width="330" height="142" rx="18" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="825" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">AUDIT + POLICY DATA</text><text x="825" y="465" text-anchor="middle" font-size="13" fill="#475569">minimum useful context</text><text x="825" y="491" text-anchor="middle" font-size="13" fill="#475569">no tokens or sensitive payloads</text></g>
  <path d="M790 308 V348 H375 V378 M936 308 V378" fill="none" stroke="#64748B" stroke-width="3"/><path d="M367 370 L375 380 L383 370 M928 370 L936 380 L944 370" fill="none" stroke="#64748B" stroke-width="3"/>
  <text x="600" y="602" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#64748B">A hidden tab is UX. A server-side policy is security.</text>
</svg>
