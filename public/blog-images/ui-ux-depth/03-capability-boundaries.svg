<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Capability boundaries</title><desc id="desc">A Figma-style component map showing separate ownership within one customer route.</desc><rect width="1200" height="720" rx="28" fill="#F7F8FA"/>
  <text x="72" y="78" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#111827">ONE ROUTE, FIVE OWNERS</text><text x="72" y="108" font-family="Inter,Arial" font-size="14" fill="#64748B">Composition stays central; workflow state does not.</text>
  <rect x="72" y="148" width="1056" height="492" rx="22" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/><rect x="102" y="178" width="996" height="70" rx="14" fill="#111827"/><text x="132" y="207" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#5EEAD4">ROUTE + COMPOSITION</text><text x="132" y="232" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#FFF">CustomerWorkspace  /customers/:id</text>
  <g font-family="Inter,Arial"><rect x="102" y="286" width="300" height="132" rx="16" fill="#EFF6FF" stroke="#93C5FD"/><text x="126" y="320" font-size="13" font-weight="700" fill="#1D4ED8">CUSTOMER SUMMARY</text><text x="126" y="350" font-size="15" fill="#1E293B">profile query · version</text><text x="126" y="378" font-size="13" fill="#64748B">Owner: customer capability</text><rect x="450" y="286" width="300" height="132" rx="16" fill="#FFF7ED" stroke="#FDBA74"/><text x="474" y="320" font-size="13" font-weight="700" fill="#C2410C">EVIDENCE</text><text x="474" y="350" font-size="15" fill="#1E293B">uploads · scan · retry</text><text x="474" y="378" font-size="13" fill="#64748B">Owner: evidence capability</text><rect x="798" y="286" width="300" height="132" rx="16" fill="#F0FDFA" stroke="#5EEAD4"/><text x="822" y="320" font-size="13" font-weight="700" fill="#0F766E">RISK ASSESSMENT</text><text x="822" y="350" font-size="15" fill="#1E293B">command · progress</text><text x="822" y="378" font-size="13" fill="#64748B">Owner: risk capability</text>
  <rect x="276" y="458" width="300" height="132" rx="16" fill="#FEF2F2" stroke="#FCA5A5"/><text x="300" y="492" font-size="13" font-weight="700" fill="#B91C1C">ACCESS</text><text x="300" y="522" font-size="15" fill="#1E293B">roles · policy · audit</text><text x="300" y="550" font-size="13" fill="#64748B">Owner: identity capability</text><rect x="624" y="458" width="300" height="132" rx="16" fill="#F5F3FF" stroke="#C4B5FD"/><text x="648" y="492" font-size="13" font-weight="700" fill="#6D28D9">AI ASSISTANT</text><text x="648" y="522" font-size="15" fill="#1E293B">scoped conversation</text><text x="648" y="550" font-size="13" fill="#64748B">Owner: assistant capability</text></g>
  <path d="M600 248 V270 M252 270 H948 M252 270 V286 M600 270 V286 M948 270 V286 M426 270 V458 M774 270 V458" fill="none" stroke="#94A3B8" stroke-width="2"/>
