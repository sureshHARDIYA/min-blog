<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Complexity transfer</title><desc id="desc">A design canvas showing user effort falling while system coordination rises.</desc><rect width="1200" height="620" rx="28" fill="#F7F8FA"/>
  <text x="82" y="88" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#111827">SIMPLIFICATION DOES NOT DELETE COMPLEXITY</text><text x="82" y="120" font-family="Inter,Arial" font-size="14" fill="#64748B">It decides who carries it.</text>
  <line x1="122" y1="470" x2="1074" y2="470" stroke="#CBD5E1" stroke-width="2"/><line x1="122" y1="470" x2="122" y2="170" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M145 220 C350 245 520 330 730 395 S970 438 1042 448" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/><path d="M145 442 C330 426 520 358 710 277 S946 205 1042 190" fill="none" stroke="#14B8A6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="585" cy="328" r="12" fill="#FFF" stroke="#111827" stroke-width="4"/><rect x="446" y="270" width="278" height="44" rx="12" fill="#111827"/><text x="585" y="298" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#FFF">PRODUCT DESIGN DECISION</text>
  <text x="160" y="202" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#2563EB">USER EFFORT</text><text x="865" y="176" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#0F766E">SYSTEM COORDINATION</text>
  <text x="600" y="535" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#475569">Scope removed = true simplification  ·  Work hidden = transferred complexity</text>
</svg>
