<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Authorization evidence loop</title><desc id="desc">A threat scenario becomes a policy, an executable test, telemetry and a reviewed decision, which feeds future improvements.</desc>
  <rect width="1200" height="560" fill="#0c0c0c"/>
  <text x="70" y="70" fill="#00ff41" font-family="monospace" font-size="18" font-weight="700">SECURITY THAT LEAVES EVIDENCE</text>
  <text x="70" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">A control is stronger when the team can verify it</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="240" cy="300" r="105" fill="#151515" stroke="#ffb020" stroke-width="2"/><text x="240" y="285" fill="#fff" font-size="21" font-weight="700">Threat scenario</text><text x="240" y="320" fill="#aaa" font-size="16">cross-tenant read</text>
    <circle cx="600" cy="300" r="105" fill="#151515" stroke="#00ff41" stroke-width="2"/><text x="600" y="285" fill="#fff" font-size="21" font-weight="700">Policy + test</text><text x="600" y="320" fill="#aaa" font-size="16">deny and prove</text>
    <circle cx="960" cy="300" r="105" fill="#151515" stroke="#4da3ff" stroke-width="2"/><text x="960" y="285" fill="#fff" font-size="21" font-weight="700">Telemetry</text><text x="960" y="320" fill="#aaa" font-size="16">decision without secrets</text>
  </g>
  <path d="M345 300h140" stroke="#777" stroke-width="3"/><path d="M485 300l-14-8v16z" fill="#777"/><path d="M705 300h140" stroke="#777" stroke-width="3"/><path d="M845 300l-14-8v16z" fill="#777"/>
  <path d="M960 420c0 90-720 90-720 0" fill="none" stroke="#00ff41" stroke-width="3" stroke-dasharray="8 8"/><path d="M240 420l-8 14h16z" fill="#00ff41"/>
  <text x="600" y="510" fill="#00ff41" font-family="monospace" font-size="17" text-anchor="middle">FINDINGS AND INCIDENTS IMPROVE THE NEXT POLICY</text>
</svg>
