<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">A broken object authorization attack</title><desc id="desc">A signed-in user changes an invoice identifier. An unsafe query returns another tenant's invoice, while a tenant-scoped query denies it.</desc>
  <rect width="1200" height="600" fill="#0c0c0c"/>
  <text x="70" y="70" fill="#00ff41" font-family="monospace" font-size="18" font-weight="700">THE ONE-DIGIT ATTACK</text>
  <text x="70" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">The token stays valid. The object ID changes.</text>
  <rect x="70" y="170" width="1060" height="105" rx="8" fill="#151515" stroke="#555"/>
  <text x="105" y="215" fill="#aaa" font-family="monospace" font-size="18">GET /api/invoices/</text><text x="340" y="215" fill="#fff" font-family="monospace" font-size="26">841</text>
  <path d="M400 210h160" stroke="#ff4d4d" stroke-width="3"/><path d="M560 210l-14-8v16z" fill="#ff4d4d"/>
  <text x="600" y="215" fill="#ff4d4d" font-family="monospace" font-size="26">842</text><text x="680" y="215" fill="#aaa" font-family="Arial, sans-serif" font-size="18">same user · same token · different object</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="330" width="500" height="180" rx="8" fill="#1b1010" stroke="#ff4d4d"/><text x="105" y="380" fill="#ff4d4d" font-size="20" font-weight="700">UNSAFE LOOKUP</text><text x="105" y="425" fill="#fff" font-family="monospace" font-size="18">WHERE invoice_id = :id</text><text x="105" y="470" fill="#ddd" font-size="18">Result: another tenant's invoice</text>
    <rect x="630" y="330" width="500" height="180" rx="8" fill="#101b13" stroke="#00ff41"/><text x="665" y="380" fill="#00ff41" font-size="20" font-weight="700">SCOPED LOOKUP</text><text x="665" y="425" fill="#fff" font-family="monospace" font-size="18">WHERE tenant_id = :tenant AND id = :id</text><text x="665" y="470" fill="#ddd" font-size="18">Result: not found or denied</text>
  </g>
</svg>
