# Locale-rich presentation components deliberately keep English and Norwegian
# copy side by side. Sonar's token-based duplication detector treats the shared
# translation shape as duplicated executable code even though the strings differ.
# TypeScript compilation still covers these files; exclude only their CPD metric.
sonar.cpd.exclusions=src/app/security/SecurityContent.tsx,src/app/privacy/PrivacyContent.tsx
